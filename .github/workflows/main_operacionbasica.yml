name: Deploy Static Site to Azure Web App - OperacionBasica

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4AEEB98DF59F47B38AF622CC9DEC735A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3BFA12E882C844DCA119B0ECA2DD4E47 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FCD454D669F4C50BB5881092E8466D5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'OperacionBasica'
          slot-name: 'Production'
          package: .
